<style>
  :root {
    --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #F7F8FA;
    --ink: #1B2430; --ink-muted: #5B6472; --ink-faint: #8891A0;
    --accent: #2C3E6B; --accent-soft: #E4E8F2;
    --win: #1F7A52; --win-bg: #E5F3EC;
    --loss: #B3402E; --loss-bg: #FBEAE6;
    --amber: #9A6B14; --amber-bg: #FBF1DD;
    --border: #DDE1E8; --border-strong: #C6CBD4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151C; --surface: #1A1E27; --surface-2: #1F2430;
      --ink: #E7EAF0; --ink-muted: #9AA3B2; --ink-faint: #6B7180;
      --accent: #8DA0DE; --accent-soft: #212843;
      --win: #4FBE8D; --win-bg: #16281F;
      --loss: #E27B69; --loss-bg: #2E1A17;
      --amber: #E0B34D; --amber-bg: #302509;
      --border: #2A2F3B; --border-strong: #3A4152;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: clamp(16px, 4vw, 40px) clamp(12px, 3vw, 24px) 60px; }
  .sheet { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 4vw, 30px); margin: 0; }
  .refresh-note { font-size: 12px; color: var(--ink-faint); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-muted); background: none;
    border: none; border-bottom: 2px solid transparent; padding: 10px 4px; margin-right: 14px; cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn .count { font-size: 11px; color: var(--ink-faint); margin-left: 4px; }

  .panel { display: none; flex-direction: column; gap: 10px; }
  .panel.active { display: flex; }

  .state-msg { color: var(--ink-faint); font-size: 13px; padding: 24px 4px; text-align: center; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title { font-weight: 700; font-size: 14.5px; }
  .card-sub { font-size: 12.5px; color: var(--ink-muted); }
  .card-time { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card-body { font-size: 13px; color: var(--ink-muted); line-height: 1.5; white-space: pre-wrap; }
  .card-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .card-meta b { color: var(--ink); }

  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
  .badge.win { color: var(--win); background: var(--win-bg); }
  .badge.loss { color: var(--loss); background: var(--loss-bg); }
  .badge.amber { color: var(--amber); background: var(--amber-bg); }
  .badge.neutral { color: var(--accent); background: var(--accent-soft); }

  .pnl.win { color: var(--win); font-weight: 700; }
  .pnl.loss { color: var(--loss); font-weight: 700; }

  details summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; font-weight: 600; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 8px; }

  details.parse-failures { background: var(--card-bg, #fff); border: 1px solid var(--amber, #b45309); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
  details.parse-failures summary { color: var(--amber, #b45309); }
  details.parse-failures .check-row { padding: 4px 0; flex-wrap: wrap; align-items: center; }
  details.parse-failures .check-row .badge { margin: 0 4px; }
  details.parse-failures .check-row .card-time { margin-left: auto; }

  .tab-header { margin-bottom: 14px; font-size: 13px; color: var(--ink-faint, #666); }
  .tab-header p { margin: 0 0 8px; }
  .tab-header .status-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .tab-header .status-legend li { display: flex; align-items: center; gap: 8px; }
  .tab-header .status-legend .badge { flex-shrink: 0; }

  /* Quarterly Results verdict pill, margin/EPS rows, RS Rank chip, and the
     click-to-expand "why this verdict" breakdown (added 2026-07-30). */
  .verdict { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 8px; padding: 4px 11px; white-space: nowrap; flex-shrink: 0; }
  .verdict.right { color: var(--win); background: var(--win-bg); }
  .verdict.mixed { color: var(--amber); background: var(--amber-bg); }
  .verdict.wrong { color: var(--loss); background: var(--loss-bg); }
  .metrics-box { display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  /* YoY/QoQ shown once as column headers (2026-08-04) instead of repeated on every row --
     same 4-column grid on the header and every data row so the columns actually line up. */
  .metrics-header { display: grid; grid-template-columns: 88px 1fr 68px 68px; gap: 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); padding-bottom: 6px; margin-bottom: 2px; border-bottom: 1px solid var(--border); }
  .metrics-header .col-yoy, .metrics-header .col-qoq { text-align: right; }
  .metric-row { display: grid; grid-template-columns: 88px 1fr 68px 68px; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-muted); padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .metrics-box .metric-row:last-child { padding-bottom: 0; border-bottom: none; }
  .metric-row .label { color: var(--ink); font-weight: 600; }
  .metric-row .yoy-cell, .metric-row .qoq-cell { text-align: right; }
  /* Rows that don't fit the YoY/QoQ comparison shape (Dividend) -- own layout,
     not the 4-column grid. */
  .metric-row-info { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-muted); padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .metrics-box .metric-row-info:last-child { padding-bottom: 0; border-bottom: none; }
  .metric-row-info .label { color: var(--ink); font-weight: 600; min-width: 96px; }
  .rs-chip { display: inline-flex; align-items: baseline; gap: 5px; font-size: 12px; color: var(--ink-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px; }
  .rs-chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .rs-chip.na { color: var(--ink-faint); font-style: italic; }
  .verdict-breakdown { display: flex; flex-direction: column; gap: 5px; }
  .check-row { font-size: 12.5px; line-height: 1.5; display: flex; gap: 7px; }
  .check-row .mark { flex-shrink: 0; font-weight: 800; width: 14px; text-align: center; }
  .check-row.pass .mark { color: var(--win); }
  .check-row.fail .mark { color: var(--loss); }
  .check-row.gate .mark { color: var(--amber); }
  .tally { font-size: 12.5px; color: var(--ink-muted); margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .tally b { color: var(--ink); }

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left;
    font-family: inherit; color: inherit; transition: border-color 0.15s, transform 0.1s;
    aspect-ratio: 1 / 1; /* square tiles */
  }
  .tile:hover { border-color: var(--accent); }
  .tile:active { transform: scale(0.99); }
  .tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tile-title { font-weight: 700; font-size: 14px; color: var(--ink); }
  .tile-count { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .tile-preview { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; justify-content: center; }
  .tile-preview-title {
    font-size: 12.5px; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; white-space: normal;
  }
  .tile-preview-sub { font-size: 11.5px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-preview-time { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .tile-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div>
      <div class="eyebrow">Private</div>
      <h1>Alerts Dashboard</h1>
    </div>
    <div class="refresh-note" id="refreshNote"></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="news">Market News <span class="count" id="count-news"></span></button>
    <button class="tab-btn" data-tab="swing-strategy">Swing Strategy <span class="count" id="count-swing-strategy"></span></button>
    <button class="tab-btn" data-tab="announcements">Announcements <span class="count" id="count-announcements"></span></button>
    <button class="tab-btn" data-tab="quarterly-results">Quarterly Results <span class="count" id="count-quarterly-results"></span></button>
    <button class="tab-btn" data-tab="rs-momentum">RS Momentum <span class="count" id="count-rs-momentum"></span></button>
    <button class="tab-btn" data-tab="darvasbox">Today's DarvasBox <span class="count" id="count-darvasbox"></span></button>
  </div>

  <div class="panel active" id="panel-home"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-news"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-swing-strategy"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-announcements"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-quarterly-results"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-rs-momentum"><div class="state-msg">Loading…</div></div>
  <div class="panel" id="panel-darvasbox"><div class="state-msg">Loading…</div></div>
</div>

  .rule-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
  .rule-list li { color: var(--ink-muted); }
  .rule-list b { color: var(--ink); font-weight: 600; }
  .rule-ok { color: #1a7f37; font-weight: 700; }
  .rule-no { color: #cf222e; font-weight: 700; }
  .rule-val { color: var(--ink-faint); }
  .rule-val em { font-style: italic; opacity: .8; }

  .swing-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .swing-head .tab-header { margin: 0; }
  /* Grid, not flex -- always exactly 2 columns side by side, even on a narrow phone viewport
     (flex+nowrap let the two tiles refuse to shrink and wrap onto separate lines instead). */
  .pnl-total-group { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; }
  .pnl-total { text-align: center; min-width: 0; }
  .pnl-total-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
  .pnl-total-val { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
  .pnl-total-val.win { color: var(--win); }
  .pnl-total-val.loss { color: var(--loss); }
  .pnl-total-sub { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  @media (min-width: 640px) { .pnl-total-group { width: auto; } .pnl-total { text-align: right; } }
  .swing-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .pill-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pill { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-muted); background: var(--surface); border: none; border-right: 1px solid var(--border); padding: 6px 12px; cursor: pointer; }
  .pill:last-child { border-right: none; }
  .pill.active { background: var(--accent-soft); color: var(--accent); }
  .swing-filters select, .swing-filters input[type="search"] { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .swing-filters input[type="search"] { min-width: 130px; }
  .sw-check { font-size: 12.5px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
</style>

<script>
  const TABS = {
    news: { url: '/api/dashboard/market-news', render: renderNews },
    'swing-strategy': { url: '/api/dashboard/swing', render: renderSwing },
    announcements: { url: '/api/dashboard/announcements', render: renderAnnouncements },
    'quarterly-results': { url: '/api/dashboard/quarterly-results', render: renderQuarterlyResults },
    'rs-momentum': { url: '/api/dashboard/rs-momentum', render: renderRsMomentum },
    darvasbox: { url: '/api/dashboard/darvasbox-today', render: renderDarvasbox },
  };
  const loaded = {};
  const dataCache = {};
  const TILE_LABELS = {
    news: 'Market News',
    'swing-strategy': 'Swing Strategy',
    announcements: 'Announcements',
    'quarterly-results': 'Quarterly Results',
    'rs-momentum': 'RS Momentum',
    darvasbox: "Today's DarvasBox",
  };

  function fmtTime(iso) {
    if (!iso) return '';
    return iso.replace('T', ' ').slice(0, 16);
  }
  function fmtMs(ms) {
    if (!ms) return '';
    const d = new Date(Number(ms));
    return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtPct(v) {
    if (v == null || isNaN(v)) return '—';
    return (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%';
  }

  async function fetchTabData(key) {
    // Swing tab is never session-cached: it carries LIVE prices for open positions
    // (attached server-side, cached 60s there), so re-open should show current values.
    if (dataCache[key] && key !== 'swing-strategy') return dataCache[key];
    const res = await fetch(TABS[key].url);
    if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (key !== 'swing-strategy') dataCache[key] = data;
    return data;
  }

  async function loadTab(key) {
    const panel = document.getElementById('panel-' + key);
    try {
      const data = await fetchTabData(key);
      document.getElementById('count-' + key).textContent = data.length ? data.length : '';
      if (!data.length) {
        panel.innerHTML = '<div class="state-msg">No alerts yet.</div>';
        return;
      }
      panel.innerHTML = '';
      TABS[key].render(data, panel);
    } catch (e) {
      panel.innerHTML = '<div class="state-msg">Failed to load — ' + esc(e.message) + '</div>';
    }
  }

  // One condensed preview line per category, for the home tile grid -- reuses
  // the same field names as that category's full render function above, just
  // trimmed to the single most recent item (data[0], since every endpoint
  // already sorts newest-first for its own tab view).
  function tilePreviewHtml(key, item) {
    switch (key) {
      case 'news':
        return `<div class="tile-preview-title">${esc(item.title)}</div><div class="tile-preview-time">${fmtTime(item.timestamp)}</div>`;
      case 'announcements':
        return `<div class="tile-preview-title">${esc(item.symbol) || esc(item.companyName) || 'NSE'}</div>` +
          `<div class="tile-preview-sub">${esc(item.subject)}</div>` +
          `<div class="tile-preview-time">${fmtTime(item.timestamp)}</div>`;
      case 'rs-momentum': {
        const label = { ENTRY: 'Entry', EXIT: 'Exit', ENTRY_PENDING: 'Entry (pending)', FUNDAMENTALS_CONFIRMED: 'Confirmed', FUNDAMENTALS_FAILED: 'Retracted' };
        return `<div class="tile-preview-title">${esc(item.symbol)} — ${label[item.type] || esc(item.type)}</div><div class="tile-preview-time">${esc(item.date)}</div>`;
      }
      case 'darvasbox': {
        const isExit = item.type === 'EXIT';
        const time = isExit ? fmtMs(item.exitTimestampMs) : fmtMs(item.timestampMs);
        return `<div class="tile-preview-title">${esc(item.symbol)} ${esc(item.direction)} — ${isExit ? 'Exit' : 'Entry'}</div><div class="tile-preview-time">${time} IST</div>`;
      }
      case 'quarterly-results':
        return `<div class="tile-preview-title">${esc(item.symbol)} — ${esc(item.quarterLabel)}</div>` +
          `<div class="tile-preview-sub">Revenue ${fmtCr(item.revenueCr)}</div>` +
          `<div class="tile-preview-time">${fmtTime(item.announcementDate)}</div>`;
      case 'swing-strategy': {
        const st = item.status === 'closed' ? (item.rNet >= 0 ? 'Win' : 'Loss') : (item.status.charAt(0).toUpperCase() + item.status.slice(1));
        const since = item.sinceAlertPct != null ? ' ' + fmtPct(item.sinceAlertPct) : '';
        return `<div class="tile-preview-title">${esc(item.symbol)} — ${st}${since}</div><div class="tile-preview-time">${esc(item.signalDate)}</div>`;
      }
      default:
        return '';
    }
  }

  async function loadHome() {
    const panel = document.getElementById('panel-home');
    panel.innerHTML = '<div class="tile-grid" id="tileGrid"></div>';
    const grid = document.getElementById('tileGrid');
    for (const key of Object.keys(TABS)) {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.dataset.tab = key;
      tile.innerHTML = `
        <div class="tile-top">
          <div class="tile-title">${esc(TILE_LABELS[key])}</div>
          <span class="tile-count" id="tile-count-${key}"></span>
        </div>
        <div class="tile-preview" id="tile-preview-${key}"><div class="tile-empty">Loading…</div></div>
      `;
      grid.appendChild(tile);
    }
    await Promise.all(Object.keys(TABS).map(async (key) => {
      const countEl = document.getElementById('tile-count-' + key);
      const previewEl = document.getElementById('tile-preview-' + key);
      try {
        const data = await fetchTabData(key);
        const count = data.length ? String(data.length) : '';
        countEl.textContent = count;
        document.getElementById('count-' + key).textContent = count;
        previewEl.innerHTML = data.length ? tilePreviewHtml(key, data[0]) : '<div class="tile-empty">No alerts yet.</div>';
      } catch (e) {
        previewEl.innerHTML = '<div class="tile-empty">Failed to load.</div>';
      }
    }));
  }

  function selectTab(key) {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === key));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + key));
    if (key !== 'home' && !loaded[key]) { loaded[key] = true; loadTab(key); }
  }

  function renderNews(items, panel) {
    for (const n of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${esc(n.title)}</div>
          <div class="card-time">${fmtTime(n.timestamp)}</div>
        </div>
        <div class="card-meta"><span class="badge neutral">Impact ${esc(n.score)}/10</span>${n.source ? `<span>${esc(n.source)}</span>` : ''}</div>
        ${n.impact ? `<div class="card-body">${esc(n.impact)}</div>` : ''}
      `;
      panel.appendChild(card);
    }
  }

  function renderAnnouncements(items, panel) {
    const catBadge = { TRADE_SIGNAL: 'win', ALERT_ONLY: 'neutral', CIRCULAR: 'amber' };
    for (const a of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${esc(a.symbol) || esc(a.companyName) || 'NSE'}${a.companyName && a.symbol ? ` <span class="card-sub">(${esc(a.companyName)})</span>` : ''}</div>
          <div class="card-time">${fmtTime(a.timestamp)}</div>
        </div>
        <div class="card-meta"><span class="badge ${catBadge[a.category] || 'neutral'}">${esc(a.category || '')}</span></div>
        <div class="card-body">${esc(a.subject)}</div>
        ${a.message ? `<details><summary>Full alert</summary><div class="card-body">${esc(a.message)}</div></details>` : ''}
      `;
      panel.appendChild(card);
    }
  }

  function forwardPerfMeta(item) {
    // "How did it do after we alerted it" -- a live, as-of-today figure computed
    // daily server-side (see DashboardDataController::attachForwardPerformance),
    // not tied to this specific past event, so it's shown the same on every
    // card for that symbol.
    if (item.returnSinceAlert == null) return '';
    return `<span>Now <b>₹${esc(item.currentPrice)}</b></span><span class="pnl ${item.returnSinceAlert >= 0 ? 'win' : 'loss'}">Since alert: ${fmtPct(item.returnSinceAlert)}</span>`;
  }

  // One row per symbol, current status only (Postgres rs_momentum_status, upserted
  // in place by rs-momentum-strategy-live -- see RsMomentumService) -- NOT a raw
  // event log, so a symbol that cycles through multiple statuses over time shows
  // as a single card, sorted by when its status last changed.
  const RS_MOMENTUM_HEADER_HTML = `
    <div class="tab-header">
      <p>Stocks whose Relative Strength rank crossed the entry/exit thresholds of this
      strategy's universe (~300 stocks). One card per stock, showing its <b>current</b>
      status — newest change first.</p>
      <ul class="status-legend">
        <li><span class="badge amber">Entry (pending)</span> RS rank crossed ≥80; Sales Growth 3Y fundamentals gate not checked yet (Screener.in was unreachable).</li>
        <li><span class="badge win">Entry</span> RS rank crossed ≥80 and Sales Growth 3Y ≥15% gate cleared — tracked as a live long position.</li>
        <li><span class="badge win">Confirmed</span> A pending entry's fundamentals gate cleared on retry.</li>
        <li><span class="badge loss">Retracted</span> A pending entry's fundamentals gate failed on retry — no longer tracked.</li>
        <li><span class="badge neutral">Exit</span> RS rank dropped below 50 — position closed.</li>
      </ul>
    </div>`;

  function renderRsMomentum(items, panel) {
    panel.insertAdjacentHTML('beforeend', RS_MOMENTUM_HEADER_HTML);
    const badge = { ENTRY: 'win', EXIT: 'neutral', ENTRY_PENDING: 'amber', FUNDAMENTALS_CONFIRMED: 'win', FUNDAMENTALS_FAILED: 'loss' };
    const label = { ENTRY: 'Entry', EXIT: 'Exit', ENTRY_PENDING: 'Entry (pending)', FUNDAMENTALS_CONFIRMED: 'Confirmed', FUNDAMENTALS_FAILED: 'Retracted' };
    for (const r of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const pnl = r.pnlPct != null ? `<span class="pnl ${r.pnlPct >= 0 ? 'win' : 'loss'}">${fmtPct(r.pnlPct)}</span>` : '';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${esc(r.symbol)}</div>
          <div class="card-time">${esc(r.date)}</div>
        </div>
        <div class="card-meta">
          <span class="badge ${badge[r.type] || 'neutral'}">${label[r.type] || esc(r.type)}</span>
          ${r.price != null ? `<span>Price <b>₹${esc(r.price)}</b></span>` : ''}
          ${r.rsRankAtEntry != null ? `<span>RS Rank <b>${Number(r.rsRankAtEntry).toFixed(1)}</b></span>` : ''}
          ${r.salesGrowth3Y != null ? `<span>Sales Growth 3Y <b>${esc(r.salesGrowth3Y)}%</b></span>` : ''}
          ${pnl}
          ${forwardPerfMeta(r)}
        </div>
      `;
      panel.appendChild(card);
    }
  }

  function renderDarvasbox(items, panel) {
    // DarvasBox SHADOW trade (0.25% brick, flat 1% stop, LTP-confirmed
    // entries/exits, both directions) -- server already filters to today
    // (IST). ENTRY cards show the stop; EXIT cards show exit/reason/P&L,
    // plus rupee P&L (real holding qty) when the trade log has it.
    for (const t of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const isExit = t.type === 'EXIT';
      const dirBadge = t.direction === 'LONG' ? 'win' : 'loss';
      const time = isExit ? fmtMs(t.exitTimestampMs) : fmtMs(t.timestampMs);
      const rsNote = isExit && t.pnlRs != null ? ` <span class="pnl ${t.pnlRs >= 0 ? 'win' : 'loss'}">${t.pnlRs >= 0 ? '+' : '−'}₹${Math.abs(t.pnlRs).toFixed(0)}</span>` : '';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${esc(t.symbol)}</div>
          <div class="card-time">${time} IST</div>
        </div>
        <div class="card-meta">
          <span class="badge ${dirBadge}">${esc(t.direction)}</span>
          <span class="badge neutral">${isExit ? 'Exit' : 'Entry'}</span>
          <span>Entry <b>₹${esc(t.entry)}</b></span>
          ${isExit ? `<span>Exit <b>₹${esc(t.exitPrice)}</b></span><span>${esc(t.action)}</span><span class="pnl ${t.pnlPct >= 0 ? 'win' : 'loss'}">${fmtPct(t.pnlPct)}</span>${rsNote}` : `<span>Stop <b>₹${esc(t.stop)}</b></span>`}
        </div>
      `;
      panel.appendChild(card);
    }
  }

  function renderSwing(items, panel) {
    panel.innerHTML = '';

    // Header: description (left) + P&L totals (right). Totals are recomputed in apply()
    // below over whatever's currently filtered, not always the full item list -- so
    // switching to e.g. "Full-spec only" or a single month shows that slice's own P&L.
    const head = document.createElement('div');
    head.className = 'swing-head';
    head.innerHTML =
      '<div class="tab-header"><p>Trimmed confluence swing — daily 19:00 IST scan. Paper/forward tracking. ' +
      '<b>Since alert %</b> = entry → latest (open) or → exit (closed).</p></div>' +
      '<div class="pnl-total-group">' +
      '<div class="pnl-total">' +
      '<div class="pnl-total-label">Total P&amp;L (avg/trade)</div>' +
      '<div class="pnl-total-val" id="sw-total-val">—</div>' +
      '<div class="pnl-total-sub" id="sw-total-sub"></div>' +
      '</div>' +
      '<div class="pnl-total">' +
      '<div class="pnl-total-label">Cumulative P&amp;L (naive sum)</div>' +
      '<div class="pnl-total-val" id="sw-cum-val">—</div>' +
      '<div class="pnl-total-sub">equal-sized unit per trade, summed, not compounded</div>' +
      '</div>' +
      '</div>';
    panel.appendChild(head);

    // Filter bar: status pills · month (by signal date) · symbol search · result · full-spec.
    const months = [...new Set(items.map((s) => (s.signalDate || '').slice(0, 7)).filter(Boolean))].sort().reverse();
    const monthLabel = (m) => { const [y, mo] = m.split('-'); return new Date(Number(y), Number(mo) - 1, 1).toLocaleString('en-US', { month: 'short' }) + ' ' + y; };
    const bar = document.createElement('div');
    bar.className = 'swing-filters';
    bar.innerHTML =
      '<div class="pill-group" id="sw-status">' +
      ['all', 'today', 'open', 'pending', 'closed'].map((s, i) => `<button class="pill${i === 0 ? ' active' : ''}" data-status="${s}">${s === 'all' ? 'All' : s === 'today' ? 'Action today' : s[0].toUpperCase() + s.slice(1)}</button>`).join('') +
      '</div>' +
      `<select id="sw-month"><option value="all">All months</option>${months.map((m) => `<option value="${m}">${monthLabel(m)}</option>`).join('')}</select>` +
      '<input id="sw-symbol" type="search" placeholder="Search symbol…" autocomplete="off" />' +
      '<select id="sw-result"><option value="all">All results</option><option value="win">Wins</option><option value="loss">Losses</option></select>' +
      '<label class="sw-check"><input type="checkbox" id="sw-fullspec" /> Full-spec only</label>';
    panel.appendChild(bar);

    const list = document.createElement('div');
    list.style.display = 'flex';
    list.style.flexDirection = 'column';
    list.style.gap = '10px';
    panel.appendChild(list);

    const state = { status: 'all', month: 'all', symbol: '', result: 'all', fullspec: false };

    function cardHtml(s) {
      const isClosed = s.status === 'closed';
      const statusBadge = s.status === 'open' ? 'amber' : s.status === 'pending' ? 'neutral' : (s.rNet >= 0 ? 'win' : 'loss');
      const statusLabel = isClosed ? (s.rNet >= 0 ? 'Closed ✓' : 'Closed ✗') : (s.status.charAt(0).toUpperCase() + s.status.slice(1));
      let rules = {};
      try { rules = JSON.parse(s.rules || '{}'); } catch (_) { /* keep {} */ }
      const chk = (ok) => (ok ? '<span class="rule-ok">✓</span>' : '<span class="rule-no">✗</span>');
      const z = rules.zone || {}, t = rules.trend || {}, g = rules.trigger || {}, r = rules.rsi || {};
      const rulesHtml =
        '<ul class="rule-list">' +
        `<li>${chk(z.pass)} <b>Daily demand zone</b>${z.proximal != null ? ` <span class="rule-val">₹${esc(z.distal)}–${esc(z.proximal)}, score ${esc(z.score)}</span>` : ''}</li>` +
        `<li>${chk(t.pass)} <b>Weekly 50-SMA trend up</b>${t.wsma50 != null ? ` <span class="rule-val">wSMA50 ₹${esc(t.wsma50)}, price above</span>` : ''}</li>` +
        `<li>${chk(g.pass)} <b>9/20-EMA cross + volume</b>${g.ema9 != null ? ` <span class="rule-val">9EMA ${esc(g.ema9)} &gt; 20SMA ${esc(g.sma20)}, vol &gt;1.2×avg</span>` : ''}</li>` +
        `<li>${chk(r.pass)} <b>RSI ≥55 (D/W/M)</b> <span class="rule-val">${esc(r.d)}/${esc(r.w)}/${esc(r.m)} <em>(recorded, not gated)</em></span></li>` +
        '</ul>';
      const since = s.sinceAlertPct != null ? `<span class="pnl ${s.sinceAlertPct >= 0 ? 'win' : 'loss'}">${fmtPct(s.sinceAlertPct)}</span>` : '';
      const todayMove = s.status === 'open' && s.todayPct != null ? `<span>Today <span class="pnl ${s.todayPct >= 0 ? 'win' : 'loss'}">${fmtPct(s.todayPct)}</span></span>` : '';
      // Distinct from the status badge above -- flags *why* this card needs a look today,
      // separate from what its lifecycle status is (an old closed trade and one that
      // closed an hour ago both say "Closed", only this badge tells them apart).
      let actionBadge = '';
      if (todayStr() === s.halfDate) actionBadge = '<span class="badge win">⚡ Half-booked today</span>';
      else if (todayStr() === s.exitDate) actionBadge = `<span class="badge ${s.rNet >= 0 ? 'win' : 'loss'}">🚪 Exited today</span>`;
      else if (s.status === 'pending' && todayStr() === s.signalDate) actionBadge = '<span class="badge amber">🆕 New signal — plan tomorrow\'s open</span>';
      return `<div class="card">
        <div class="card-top"><div class="card-title">${esc(s.symbol)}</div><div class="card-time">${esc(s.signalDate)}</div></div>
        <div class="card-meta">
          <span class="badge ${statusBadge}">${statusLabel}</span>
          ${actionBadge}
          ${s.entryPx != null ? `<span>Entry <b>₹${esc(s.entryPx)}</b></span>` : ''}
          <span>Stop <b>₹${esc(s.stopPx)}</b></span>
          ${s.riskPct != null ? `<span>Risk <b>${esc(s.riskPct)}%</b></span>` : ''}
          ${s.target1Px != null ? `<span>+2R <b>₹${esc(s.target1Px)}</b></span>` : ''}
          ${s.halfDate != null ? `<span>Half-booked <b>₹${esc(s.halfPrice)}</b> <span class="card-time">(${esc(s.halfDate)})</span></span>` : ''}
          ${isClosed ? `<span>Exit <b>₹${esc(s.exitPx)}</b></span><span>Closed <b>${esc(s.exitDate)}</b></span><span class="pnl ${s.rNet >= 0 ? 'win' : 'loss'}">${Number(s.rNet).toFixed(2)}R</span><span class="badge ${s.rNet < 0 ? 'loss' : 'win'}">${s.rNet < 0 ? 'Stopped out (−1R)' : 'Hit +2R → trailed'}</span>` : ''}
          ${since ? `<span>Since alert ${since}</span>` : ''}
          ${todayMove}
          ${s.rsiGatePass ? '<span class="badge win">full-spec</span>' : ''}
        </div>
        ${rulesHtml}
      </div>`;
    }

    function todayStr() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }); // en-CA = YYYY-MM-DD
    }

    function apply() {
      let f = items.slice();
      if (state.status === 'today') f = f.filter((s) => s.actionToday);
      else if (state.status !== 'all') f = f.filter((s) => s.status === state.status);
      if (state.month !== 'all') f = f.filter((s) => (s.signalDate || '').slice(0, 7) === state.month);
      if (state.symbol) { const q = state.symbol.toLowerCase(); f = f.filter((s) => (s.symbol || '').toLowerCase().includes(q)); }
      if (state.fullspec) f = f.filter((s) => s.rsiGatePass === true);
      if (state.result !== 'all') f = f.filter((s) => s.status === 'closed' && (state.result === 'win' ? Number(s.rNet) > 0 : Number(s.rNet) <= 0));
      list.innerHTML = f.length ? f.map(cardHtml).join('') : '<div class="state-msg">No signals match these filters.</div>';
      const badge = document.getElementById('count-swing-strategy');
      if (badge) badge.textContent = f.length || '';
      updateTotals(f);
    }

    // Total (avg/trade) and Cumulative (naive sum) P&L, over whatever's currently filtered.
    function updateTotals(f) {
      const withPnl = f.filter((s) => s.sinceAlertPct != null);
      const totalPnl = withPnl.length ? withPnl.reduce((a, s) => a + Number(s.sinceAlertPct), 0) / withPnl.length : null;
      const cumPnl = withPnl.length ? withPnl.reduce((a, s) => a + Number(s.sinceAlertPct), 0) : null;
      const closedRows = f.filter((s) => s.status === 'closed');
      const wins = closedRows.filter((s) => Number(s.rNet) > 0).length;
      const totalVal = document.getElementById('sw-total-val');
      const totalSub = document.getElementById('sw-total-sub');
      const cumVal = document.getElementById('sw-cum-val');
      if (totalVal) { totalVal.textContent = totalPnl == null ? '—' : fmtPct(totalPnl); totalVal.className = 'pnl-total-val' + (totalPnl == null ? '' : totalPnl >= 0 ? ' win' : ' loss'); }
      if (totalSub) totalSub.textContent = `${f.length} recorded · ${closedRows.length} closed${closedRows.length ? ' · ' + Math.round((100 * wins) / closedRows.length) + '% win' : ''}`;
      if (cumVal) { cumVal.textContent = cumPnl == null ? '—' : fmtPct(cumPnl); cumVal.className = 'pnl-total-val' + (cumPnl == null ? '' : cumPnl >= 0 ? ' win' : ' loss'); }
    }

    bar.querySelector('#sw-status').addEventListener('click', (e) => {
      const b = e.target.closest('.pill'); if (!b) return;
      bar.querySelectorAll('#sw-status .pill').forEach((p) => p.classList.remove('active'));
      b.classList.add('active'); state.status = b.dataset.status; apply();
    });
    bar.querySelector('#sw-month').addEventListener('change', (e) => { state.month = e.target.value; apply(); });
    bar.querySelector('#sw-symbol').addEventListener('input', (e) => { state.symbol = e.target.value.trim(); apply(); });
    bar.querySelector('#sw-result').addEventListener('change', (e) => { state.result = e.target.value; apply(); });
    bar.querySelector('#sw-fullspec').addEventListener('change', (e) => { state.fullspec = e.target.checked; apply(); });
    apply();
  }

  function fmtCr(v) {
    if (v == null || isNaN(v)) return '—';
    return '₹' + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 0 }) + ' Cr';
  }
  // One comparison cell (under the YoY or QoQ column header): a swing label
  // takes priority over a raw % (see QuarterlyResultsService.profitSwingType --
  // a raw % across a loss<->profit sign flip is either undefined or misleading,
  // e.g. -10 -> +5 is a genuine turnaround, not "-150%"). No "YoY"/"QoQ" text
  // prefix (2026-08-04) -- that's now conveyed once by the column header instead
  // of repeated on every row.
  function comparisonBadge(baseValue, pct, swingType) {
    if (swingType) {
      return `<span class="badge ${swingType === 'LOSS_TO_PROFIT' ? 'win' : 'loss'}" title="vs ${fmtCr(baseValue)}">${swingType === 'LOSS_TO_PROFIT' ? 'Loss → Profit' : 'Profit → Loss'}</span>`;
    }
    if (pct != null) {
      return `<span class="pnl ${pct >= 0 ? 'win' : 'loss'}" title="vs ${fmtCr(baseValue)}">${fmtPct(pct)}</span>`;
    }
    return `<span class="card-sub">n/a</span>`;
  }

  // A metric row: label, current value, then the YoY/QoQ cells under their column headers
  // (hover a cell for the compared-quarter's actual figure).
  function metricMeta(label, current, yoyValue, yoyPct, yoySwing, qoqValue, qoqPct, qoqSwing) {
    if (current == null) return '';
    return `<div class="metric-row"><span class="label">${label}</span> <span><b>${fmtCr(current)}</b></span>` +
        `<span class="yoy-cell">${comparisonBadge(yoyValue, yoyPct, yoySwing)}</span>` +
        `<span class="qoq-cell">${comparisonBadge(qoqValue, qoqPct, qoqSwing)}</span></div>`;
  }

  function fmtPp(v) {
    if (v == null || isNaN(v)) return '—';
    return (v >= 0 ? '+' : '') + Number(v).toFixed(1) + 'pp';
  }

  // Same visual language as comparisonBadge, for metrics that aren't Cr figures
  // (margin, EPS) -- no swing-type case, since neither can flip sign the way
  // net profit can (margin doesn't have a LOSS_TO_PROFIT-style discontinuity).
  function plainComparisonBadge(value, isPp) {
    if (value == null) return `<span class="card-sub">n/a</span>`;
    return `<span class="pnl ${value >= 0 ? 'win' : 'loss'}">${isPp ? fmtPp(value) : fmtPct(value)}</span>`;
  }

  function marginRow(r) {
    if (r.operatingMarginPct == null) return '';
    return `<div class="metric-row"><span class="label">Op. Margin</span> <span><b>${Number(r.operatingMarginPct).toFixed(1)}%</b></span>` +
        `<span class="yoy-cell">${plainComparisonBadge(r.operatingMarginYoyPp, true)}</span>` +
        `<span class="qoq-cell">${plainComparisonBadge(r.operatingMarginQoqPp, true)}</span></div>`;
  }

  function epsRow(r) {
    if (r.eps == null) return '';
    return `<div class="metric-row"><span class="label">EPS</span> <span><b>₹${Number(r.eps).toFixed(2)}</b></span>` +
        `<span class="yoy-cell">${plainComparisonBadge(r.epsYoyPct, false)}</span>` +
        `<span class="qoq-cell">${plainComparisonBadge(r.epsQoqPct, false)}</span></div>`;
  }

  function ebitdaRow(r) {
    return metricMeta('EBITDA', r.ebitdaCr, r.ebitdaYoyCr, r.ebitdaYoyPct, r.ebitdaYoySwingType, r.ebitdaQoqCr, r.ebitdaQoqPct, r.ebitdaQoqSwingType);
  }

  // Scanned from the same results PDF, separately from the financial figures (Screener.in
  // doesn't carry dividend data at all) -- see ResultsPdfParser.scanForDividend. Absent
  // (not 0) whenever no dividend was declared this quarter, or a real one couldn't be
  // confidently extracted -- never guessed, see that class's docstring.
  function dividendRow(r) {
    if (r.dividendAmount == null) return '';
    const recordDateText = r.dividendRecordDate ? ` <span class="card-sub">Record Date: ${esc(r.dividendRecordDate)}</span>` : '';
    // Not a YoY/QoQ comparison metric, so it doesn't use the 4-column .metric-row grid --
    // see .metric-row-info in the stylesheet.
    return `<div class="metric-row-info"><span class="label">💰 Dividend</span> <b>₹${Number(r.dividendAmount).toFixed(2)} / share</b>${recordDateText}</div>`;
  }

  function rsRankChip(r) {
    if (r.rsRank == null) {
      return '<span class="rs-chip na" title="Only ~300 stocks in the RS Momentum universe have a rank">RS Rank — n/a</span>';
    }
    return `<span class="rs-chip">RS Rank <b>${Number(r.rsRank).toFixed(0)}</b></span>`;
  }

  const VERDICT_LABEL = { RIGHT: 'Right', MIXED: 'Mixed', WRONG: 'Wrong' };
  const VERDICT_CLASS = { RIGHT: 'right', MIXED: 'mixed', WRONG: 'wrong' };

  function verdictPill(r) {
    if (!r.verdict) return '';
    return `<span class="verdict ${VERDICT_CLASS[r.verdict] || ''}">${VERDICT_LABEL[r.verdict] || esc(r.verdict)}</span>`;
  }

  // Recomputes the SAME 4-signal YoY tally + profitability gate as
  // QuarterlyResultsService.verdict() (Java), purely for display -- this
  // never overrides r.verdict, which is always the server's own computed
  // value; it only explains how that value was reached from the numbers
  // already on the card.
  function verdictBreakdown(r) {
    const rows = [];
    let total = 0, positive = 0;

    if (r.revenueYoyPct != null) {
      total++;
      const pass = r.revenueYoyPct > 0;
      if (pass) positive++;
      rows.push({ pass, text: `Revenue YoY ${fmtPct(r.revenueYoyPct)}` });
    }

    const hasProfitSignal = r.netProfitYoyPct != null || r.profitYoySwingType != null;
    if (hasProfitSignal) {
      total++;
      const pass = r.profitYoySwingType === 'LOSS_TO_PROFIT' || (!r.profitYoySwingType && r.netProfitYoyPct > 0);
      if (pass) positive++;
      const text = r.profitYoySwingType
          ? (r.profitYoySwingType === 'LOSS_TO_PROFIT' ? 'Net profit swung Loss → Profit YoY' : 'Net profit swung Profit → Loss YoY')
          : `Net profit YoY ${fmtPct(r.netProfitYoyPct)}`;
      rows.push({ pass, text });
    }

    if (r.operatingMarginYoyPp != null) {
      total++;
      const pass = r.operatingMarginYoyPp > 0;
      if (pass) positive++;
      rows.push({ pass, text: `Operating margin YoY ${fmtPp(r.operatingMarginYoyPp)}` });
    }

    if (r.epsYoyPct != null) {
      total++;
      const pass = r.epsYoyPct > 0;
      if (pass) positive++;
      rows.push({ pass, text: `EPS YoY ${fmtPct(r.epsYoyPct)}` });
    }

    return { rows, total, positive, gated: r.netProfitCr != null && r.netProfitCr < 0 };
  }

  function verdictDetailsHtml(r) {
    if (!r.verdict) return '';
    const b = verdictBreakdown(r);
    const label = VERDICT_LABEL[r.verdict] || esc(r.verdict);
    let html = `<details><summary>Why "${label}"?</summary><div class="verdict-breakdown">`;
    html += b.gated
        ? `<div class="check-row gate"><span class="mark">⚠</span> Net LOSS this quarter (${fmtCr(r.netProfitCr)}) — caps the verdict at Mixed, regardless of momentum below</div>`
        : `<div class="check-row pass"><span class="mark">✓</span> Profitable this quarter (${fmtCr(r.netProfitCr)}) — verdict isn't capped</div>`;
    for (const row of b.rows) {
      html += `<div class="check-row ${row.pass ? 'pass' : 'fail'}"><span class="mark">${row.pass ? '✓' : '✗'}</span> ${esc(row.text)}</div>`;
    }
    html += `<div class="tally">${b.positive} of ${b.total} YoY signals positive` +
        `${b.gated ? ' — but still unprofitable, so it can’t score "Right"' : ''} → <b>${label}</b>. ` +
        `QoQ figures on the card are shown for context but aren't counted in this tally, since a single ` +
        `quarter's bounce can look like a recovery while the YoY trend tells the real story.</div>`;
    html += `</div></details>`;
    return html;
  }

  // Companies whose results PDF/data couldn't be parsed -- fetched separately from the main
  // list (its own endpoint/table, quarterly_results_failures) since a parse failure has no
  // row in quarterly_results at all. Rendered as a collapsed-by-default section above the
  // successful cards so it doesn't bury the main list, but stays visible enough that a
  // failure isn't mistaken for "NSE hasn't announced this company's results yet".
  const FAILURE_REASON_LABEL = {
    no_quarter_data: 'No quarter data found on Screener.in',
    no_revenue_or_profit: 'Screener.in series had no revenue or profit figure',
    pdf_unparseable: 'Filed results PDF could not be parsed',
    db_error: 'Database error while saving the parsed result',
  };

  async function renderQuarterlyResultsFailures(container) {
    let failures;
    try {
      const res = await fetch('/api/dashboard/quarterly-results-failures');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      failures = await res.json();
    } catch (e) {
      return; // best-effort -- the main results list already loaded fine, don't block on this
    }
    if (!failures.length) return;

    const details = document.createElement('details');
    details.className = 'parse-failures';
    const rows = failures.map(f => `
      <div class="check-row fail">
        <span class="mark">✗</span>
        <b>${esc(f.symbol)}</b>${f.companyName ? ` <span class="card-sub">(${esc(f.companyName)})</span>` : ''}
        ${f.quarterLabel ? `<span class="badge neutral">${esc(f.quarterLabel)}</span>` : ''}
        — ${esc(FAILURE_REASON_LABEL[f.reason] || f.reason)}
        <span class="card-time">${fmtTime(f.failedAt)}</span>
      </div>`).join('');
    details.innerHTML = `<summary>⚠ ${failures.length} compan${failures.length === 1 ? 'y' : 'ies'} failed to parse — click to view</summary>${rows}`;
    container.prepend(details);
  }

  function renderQuarterlyResults(items, panel) {
    renderQuarterlyResultsFailures(panel);
    for (const r of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${esc(r.symbol)}${r.companyName ? ` <span class="card-sub">(${esc(r.companyName)})</span>` : ''}</div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${verdictPill(r)}
            <div class="card-time">${fmtTime(r.announcementDate)}</div>
          </div>
        </div>
        <div class="card-meta"><span class="badge neutral">${esc(r.quarterLabel)}</span></div>
        <div class="metrics-box">
          <div class="metrics-header"><span></span><span></span><span class="col-yoy">YoY</span><span class="col-qoq">QoQ</span></div>
          ${metricMeta('Revenue', r.revenueCr, r.revenueYoyCr, r.revenueYoyPct, null, r.revenueQoqCr, r.revenueQoqPct, null)}
          ${metricMeta('Net Profit', r.netProfitCr, r.netProfitYoyCr, r.netProfitYoyPct, r.profitYoySwingType, r.netProfitQoqCr, r.netProfitQoqPct, r.profitQoqSwingType)}
          ${ebitdaRow(r)}
          ${marginRow(r)}
          ${epsRow(r)}
          ${dividendRow(r)}
        </div>
        <div class="card-meta">${rsRankChip(r)}</div>
        ${r.aiJudgment ? `<div class="card-body">🔎 ${esc(r.aiJudgment)}</div>` : ''}
        ${verdictDetailsHtml(r)}
      `;
      panel.appendChild(card);
    }
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    selectTab(btn.dataset.tab);
  });

  document.getElementById('panel-home').addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    selectTab(tile.dataset.tab);
  });

  document.getElementById('refreshNote').textContent = 'Loaded ' + new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
  loaded.home = true;
  loadHome();
</script>
</body>
</html>
